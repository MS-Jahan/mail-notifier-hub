name: Bug report
description: Something does not work (wrong count, no notification, a provider shows an error)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste e-mail addresses, message text, cookies or tokens. Use *Settings → Support → Copy diagnostics*, which removes them. How to investigate first: `docs/TROUBLESHOOTING.md`.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Gmail, Proton Mail, Zoho Mail, Other / several, Not provider specific]
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 / Brave 1.97 / Firefox 132
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.1.0 (shown in the browser's extensions page)"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How many accounts, signed in how (several accounts in one browser? other data center?), what you clicked.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Settings → Support → Copy diagnostics, then paste here."
      render: json
    validations: { required: true }
